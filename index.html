<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Hover — HTML e CSS</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1><span>Minhas</span> Redes Sociais</h1>
  <p>Passe o mouse sobre os cartões ou use a tecla Tab.</p>


  <main class="container">


    <article class="card" tabindex="0"
      style="--cor: #df6c70;">
      <div class="frente">
        <span class="icone" aria-hidden="true">in</span>
      </div>


      <div class="verso">
        <h2>LinkedIn</h2>
        <p>Apresente suas experiências e construa seu perfil profissional.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #76b4cf;">
      <div class="frente">
        <span class="icone" aria-hidden="true">t</span>
      </div>


      <div class="verso">
        <h2>Twitter</h2>
        <p>Compartilhe ideias e acompanhe assuntos do seu interesse.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #4db6a5;">
      <div class="frente">
        <span class="icone" aria-hidden="true">&lt;/&gt;</span>
      </div>


      <div class="verso">
        <h2>GitHub</h2>
        <p>Organize seus códigos e compartilhe projetos de programação.</p>
      </div>
    </article>


  </main>
</body>
</html>
